[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moderator-experiments"
version = "0.1.0"
description = "Cutting-plane moderator experiments on succinct games, with JLB inner oracle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "networkx>=3.0",
]

[project.optional-dependencies]
gurobi  = ["gurobipy>=10.0"]
tests   = ["pytest>=7.0"]
all     = ["gurobipy>=10.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["recommend_unknown_games*", "experiments_overnight*"]
exclude = ["tests*"]
